<div

  class="AdvancedSectionButton"
>

    type="button"
    (click)="toggleState()"
    data-qa="pnx-occtax-taxon-form-advanced"
  >
    <i
      class="fa fa-cog"
      aria-hidden="true"
    ></i>

<div
  [@state]="state"
  [id]="advancedPanelID"
>
  <ng-content />
</div>
