<div *ngIf="!autoGenerated">
  <mat-form-field
    class="w-100 filter-control"
    appearance="outline"
  >
    <mat-label>{{ selectLabel || ('Filters.Actions.Add' | translate) }}</mat-label>
    <mat-select
      [formControl]="selectControl"
      data-qa="dynamic-form-generator-select"
    >
      <mat-option [value]="null"></mat-option>
      <mat-option
        *ngFor="let formDef of formsDefinition"
        [value]="formDef"
      >
        {{ formDef?.attribut_label }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</div>

<div
  class="full-wrapper"
  *ngIf="formControlBuilded"
>
  <div
    class="dynamic-form-wrapper"
    *ngFor="let formDef of formsDisplayed; let i = index"
  >
    <pnx-dynamic-form
      class="dynamic-form padding-sm"
      [formDef]="formDef"
      [form]="myFormGroup"
      [update]="update"
    ></pnx-dynamic-form>
    <i
      *ngIf="!autoGenerated"
      class="fa fa-trash-o clickable trash-btn"
      (click)="removeFormControl(i)"
      aria-hidden="true"
    ></i>
  </div>
  <div
    hidden
    class="dynamic-form-wrapper"
    *ngFor="let formDef of formsHidden; let i = index"
  >
    <pnx-dynamic-form
      class="dynamic-form padding-sm"
      [formDef]="formDef"
      [form]="myFormGroup"
      [update]="update"
    ></pnx-dynamic-form>
    <i
      *ngIf="!autoGenerated"
      class="fa fa-trash-o clickable trash-btn"
      (click)="removeFormControl(i)"
      aria-hidden="true"
    ></i>
  </div>
</div>
