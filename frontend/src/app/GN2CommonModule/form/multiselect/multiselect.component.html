<pnx-items-select
  [designStyle]="designStyle"
  [items]="values"
  [parentFormControl]="parentFormControl"
  [label]="label"
  [multiSelect]="true"
  [clearable]="false"
  [bindLabel]="keyLabel"
  [bindValue]="keyValue"
  [compareWith]="compareWith"
  (itemAdded)="onChange.emit($event)"
  (itemRemoved)="onDelete.emit($event)"
></pnx-items-select>
