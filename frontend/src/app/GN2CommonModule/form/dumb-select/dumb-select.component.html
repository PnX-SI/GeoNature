<mat-form-field
  class="w-100"
  appearance="outline"
>
  <mat-label>{{ label }}</mat-label>
  <mat-select
    [disableControl]="disabled"
    [formControl]="parentFormControl"
    [compareWith]="compareFn"
  >
    <mat-option
      *ngIf="displayNullValue"
      [value]="null"
    >
      {{ nullValueLabel }}
    </mat-option>
    <mat-option
      *ngFor="let item of items"
      [value]="item"
      [title]="item[titleKey]"
    >
      {{ item[displayedKey] }}
    </mat-option>
  </mat-select>
</mat-form-field>
