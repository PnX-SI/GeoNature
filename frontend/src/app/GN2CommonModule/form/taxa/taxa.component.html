<pnx-taxa-select
  [items]="taxa | async"
  [parentFormControl]="parentFormControl"
  [label]="label"
  [class]="class"
  [loading]="loading"
  [valueFieldName]="valueFieldName"
  [compareWith]="compareWith"
  (search)="taxaInput$.next($event)"
  (selectionChange)="onSelectionChange.emit($event)"
></pnx-taxa-select>
