<pnx-items-select
  [items]="observers | async"
  [parentFormControl]="parentFormControl"
  [label]="label"
  [class]="class"
  [multiSelect]="multiSelect"
  [clearable]="clearable"
  bindLabel="nom_complet"
  [bindValue]="bindValue"
  [compareWith]="bindValue ? null : compareWith"
  [placeholder]="placeHolder || label"
  dataQa="gn-common-form-observers-select"
  [optionTemplate]="option"
></pnx-items-select>

<ng-template
  #option
  let-item
>
  <div
    matTooltip="{{ item.nom_complet }}"
    matTooltipPosition="after"
  >
    <span
      class="pre-wrap"
      [attr.data-qa]="'gn-common-form-observers-select-' + item.nom_complet"
    >
      {{ item.nom_complet }}
    </span>
  </div>
</ng-template>
