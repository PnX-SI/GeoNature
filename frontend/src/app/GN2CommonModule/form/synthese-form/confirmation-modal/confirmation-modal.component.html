<div
  class="modal-container"
  data-qa="synthese-search-filters-modal"
>
  <button
    class="close-button"
    mat-icon-button
    mat-dialog-close
    aria-label="Close dialog"
  >
    <mat-icon>close</mat-icon>
  </button>
  <h4
    mat-dialog-title
    class="dialog-header"
  >
    {{ 'Filters.ConfirmSearch.DefaultTitle' | translate }}
  </h4>
  <div mat-dialog-content>
    <mat-list>
      <mat-list-item
        class="confirmation-list-item"
        lines="3"
        *ngFor="let filter of searchFilter"
      >
        <mat-icon matListItemIcon>warning</mat-icon>
        <div
          matListItemTitle
          class="confirmation-message"
        >
          {{ filter.message | translate }}
        </div>
        <!-- <div matListItemLine>{{ filter.field }}&nbsp;: {{ filter.value || 'No value' }}</div> -->
        <mat-divider></mat-divider>
      </mat-list-item>
    </mat-list>
  </div>
  <div
    mat-dialog-actions
    align="end"
  >
    <button
      type="button"
      class="modal-button"
      mat-button
      mat-raised-button
      color="primary"
      (click)="onCancelClick()"
      data-qa="synthese-search-filters-modal-cancel-button"
    >
      {{ 'Filters.ConfirmSearch.CancelButton' | translate }}
    </button>
    <button
      type="button"
      class="modal-button"
      mat-button
      mat-raised-button
      color="warn"
      (click)="onConfirmClick()"
      cdkFocusInitial
      data-qa="synthese-search-filters-modal-confirm-button"
    >
      {{ 'Filters.ConfirmSearch.SearchButton' | translate }}
    </button>
  </div>
</div>
