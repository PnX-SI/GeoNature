<pnx-items-select
  [designStyle]="designStyle"
  [items]="labels"
  [parentFormControl]="parentFormControl"
  [label]="label"
  [class]="class"
  [multiSelect]="multiSelect"
  [bindLabel]="labelLang"
  [bindValue]="keyValue"
  [compareWith]="compareWith"
  [qaTest]="label"
  appendTo="body"
  [clearAllText]="'Actions.Clear' | translate"
  [optionTemplate]="option"
></pnx-items-select>

<ng-template
  #option
  let-item
>
  <div
    matTooltip="{{ item[definitionLang] }}"
    matTooltipPosition="after"
    [attr.data-qa]="item['cd_nomenclature']"
  >
    <span class="pre-wrap">{{ item[labelLang] }}</span>
  </div>
</ng-template>
