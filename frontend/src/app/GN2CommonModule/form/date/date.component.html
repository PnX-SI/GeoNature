<mat-form-field
  class="w-100"
  appearance="outline"
>
  <mat-label>{{ label }}</mat-label>
  <input
    matInput
    ngbDatepicker
    data-qa="input-date"
    #d1="ngbDatepicker"
    [formControl]="parentFormControl"
    [errorStateMatcher]="errorMatcher"
    [disableControl]="disabled"
    [maxDate]="maxDate"
    [minDate]="minDate"
    (click)="d1.toggle(); openDatepicker(d1)"
    (dateSelect)="onSelectOrKeyIn.emit($event)"
    (keyup)="onSelectOrKeyIn.emit(parentFormControl.value)"
  />
  <button
    matSuffix
    mat-icon-button
    type="button"
    aria-label="Calendar"
    (click)="d1.toggle(); openDatepicker(d1)"
  >
    <mat-icon>calendar_today</mat-icon>
  </button>
</mat-form-field>
