<div *ngIf="designStyle === 'material'; else bootstrapBlock">
  <mat-form-field
    appearance="outline"
    class="w-100"
  >
    <mat-label>{{ placeholder || label }}</mat-label>
    <input
      matInput
      type="text"
      [formControl]="parentFormControl"
    />
    <mat-error *ngIf="parentFormControl.hasError('invalidUuid')">
      {{ 'NotValidUUID' | translate }}
    </mat-error>
  </mat-form-field>
</div>
<ng-template #bootstrapBlock>
  <small>{{ label }}</small>
  <input
    class="form-control form-control-sm"
    type="text"
    [placeholder]="placeholder"
    [formControl]="parentFormControl"
  />
  <!-- mettre le placeholder dans les fichiers de traductions -->
  <div
    *ngIf="
      parentFormControl?.hasError('invalidUuid') &&
      (parentFormControl?.touched || parentFormControl?.dirty)
    "
  >
    <small
      class="error"
      style="color: red"
    >
      {{ 'NotValidUUID' | translate }}
    </small>
  </div>
</ng-template>
