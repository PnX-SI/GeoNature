<pnx-areas-select
  [items]="areas | async"
  [parentFormControl]="parentFormControl"
  [label]="label"
  [class]="class"
  [multiSelect]="multiSelect"
  [clearable]="clearable"
  [loading]="loading"
  [valueFieldName]="valueFieldName"
  [compareWith]="compareWith"
  (search)="areas_input$.next($event)"
  (selectionChange)="onSelectionChange.emit($event)"
></pnx-areas-select>
