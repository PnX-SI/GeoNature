<ng-container *ngIf="designStyle !== 'material'; else materialBlock">
  <small>{{ label }}</small>
  <ng-select
    [ngClass]="class"
    [items]="items"
    [bindLabel]="bindLabel"
    [bindValue]="bindValue"
    [compareWith]="compareWith"
    [placeholder]="placeholder ?? label"
    [multiple]="multiSelect"
    [clearable]="clearable"
    [loading]="loading"
    [virtualScroll]="true"
    [formControl]="parentFormControl"
    [appendTo]="appendTo"
    [clearAllText]="clearAllText"
    [attr.data-qa]="dataQa"
    [attr.qa-test]="qaTest"
  >
    <ng-template
      ng-option-tmp
      let-item="item"
      let-index="index"
      let-search="searchTerm"
    >
      <ng-container
        *ngTemplateOutlet="optionTemplate || defaultOption; context: { $implicit: item }"
      ></ng-container>
    </ng-template>
  </ng-select>

  <ng-template
    #defaultOption
    let-item
  >
    <div
      matTooltip="{{ item[bindLabel] }}"
      matTooltipPosition="after"
      [attr.data-qa]="item[bindLabel]"
    >
      <span class="pre-wrap">{{ item[bindLabel] }}</span>
    </div>
  </ng-template>
</ng-container>

<ng-template #materialBlock>
  <mat-form-field
    style="display: inline-block; width: 100%"
    class="mt-2"
    appearance="outline"
  >
    <mat-label>{{ label }}</mat-label>
    <mat-select
      [formControl]="parentFormControl"
      [multiple]="multiSelect"
      [placeholder]="placeholder"
      [compareWith]="compare"
      [required]="required"
      [attr.data-qa]="dataQa"
      [attr.qa-test]="qaTest"
      (openedChange)="!$event && searchChanged('')"
    >
      <div
        *ngIf="searchable"
        class="px-2 pb-1"
      >
        <input
          type="text"
          class="form-control form-control-sm"
          placeholder="Taper pour chercher"
          data-qa="items-select-search"
          [ngModel]="search"
          (ngModelChange)="searchChanged($event)"
          (keydown)="$event.stopPropagation()"
        />
      </div>
      <mat-option
        *ngFor="let item of filteredItems"
        [value]="valueOf(item)"
        [attr.data-qa]="item[bindLabel]"
      >
        <ng-container
          *ngTemplateOutlet="optionTemplate || defaultMaterialOption; context: { $implicit: item }"
        ></ng-container>
      </mat-option>
      <mat-option
        *ngIf="filteredItems.length === 0"
        disabled
      >
        Aucun élément trouvé
      </mat-option>
    </mat-select>
    <mat-spinner
      *ngIf="loading"
      matSuffix
      diameter="18"
    ></mat-spinner>
    <button
      *ngIf="clearable && hasValue"
      matSuffix
      mat-icon-button
      type="button"
      aria-label="Clear"
      data-qa="items-select-clear"
      (click)="clear($event)"
    >
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>
</ng-template>

<ng-template
  #defaultMaterialOption
  let-item
>
  {{ item[bindLabel] }}
</ng-template>
