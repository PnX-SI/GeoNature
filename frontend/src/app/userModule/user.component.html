<div class="card card-page center-in-div">
  <div class="card-header">
    <h3 class="underlined main-color">{{ 'MyAccount.MyInformation' | translate }}</h3>
  </div>

  <div class="card-body">
    <form [formGroup]="form">
      <div>
        <div class="form-group row">
          <label
            for="nom_role"
            class="col-sm-3 col-form-label text-right"
          >
            {{ 'MyAccount.LastName' | translate }}
          </label>
          <div class="col-sm-9 col-xl-5">
            <input
              type="text"
              [ngClass]="form.disabled ? 'form-control-plaintext' : 'form-control'"
              id="nom_role"
              [placeholder]="'MyAccount.LastName' | translate"
              formControlName="nom_role"
            />
          </div>
        </div>
        <div class="form-group row">
          <label
            for="prenom_role"
            class="col-sm-3 col-form-label text-right"
          >
            {{ 'MyAccount.FirstName' | translate }}
          </label>
          <div class="col-sm-9 col-xl-5">
            <input
              type="text"
              [ngClass]="form.disabled ? 'form-control-plaintext' : 'form-control'"
              id="prenom_role"
              [placeholder]="'MyAccount.FirstName' | translate"
              formControlName="prenom_role"
            />
          </div>
        </div>

        <div class="form-group row">
          <label
            for="email"
            class="col-sm-3 col-form-label text-right"
          >
            {{ 'MyAccount.Email' | translate }}
          </label>
          <div class="col-sm-9 col-xl-5">
            <input
              type="text"
              class="form-control-plaintext non-editable"
              id="email"
              placeholder="Email"
              [value]="form.get('email').value"
              readonly
            />
          </div>
        </div>
      </div>
      <div
        class="text-center"
        *ngIf="form.disabled"
      >
        <a
          routerLink="mail_address"
          mat-raised-button
          color="primary"
        >
          {{ 'MyAccount.ChangeEmail' | translate }}
        </a>
      </div>
      <br />
      <mat-divider></mat-divider>

      <div class="mt-1">
        <div class="form-group row">
          <label
            for="identifiant"
            class="col-sm-3 col-form-label text-right"
          >
            Login
          </label>
          <div class="col-sm-9 col-xl-5">
            <input
              type="text"
              [ngClass]="form.disabled ? 'form-control-plaintext' : 'form-control'"
              id="identifiant"
              placeholder="Login"
              formControlName="identifiant"
            />
            <div
              class="invalid-feedback error"
              *ngIf="
                form.get('identifiant').errors?.['loginExists'] && form.get('identifiant').dirty
              "
            >
              {{ 'Authentication.Errors.LoginExists' | translate }}
            </div>
          </div>
        </div>
      </div>

      <div
        class="text-center"
        *ngIf="form.disabled"
      >
        <a
          routerLink="password"
          mat-raised-button
          color="primary"
        >
          {{ 'MyAccount.ChangePassword' | translate }}
        </a>
      </div>
      <br />

      <mat-divider></mat-divider>
      <div class="form-group row mt-1">
        <label
          for="remarques"
          class="col-sm-3 col-form-label text-right"
        >
          {{ 'MyAccount.Remarks' | translate }}
        </label>
        <div class="col-sm-9">
          <textarea
            id="remarques"
            [ngClass]="form.disabled ? 'form-control-plaintext' : 'form-control'"
            [placeholder]="'MyAccount.RemarksPlaceholder' | translate"
            formControlName="remarques"
          ></textarea>
        </div>
      </div>

      <div class="float-right">
        <ng-container *ngIf="form.disabled; else validation">
          <button
            type="button"
            mat-raised-button
            color="primary"
            [matTooltip]="'MyAccount.EditTooltip' | translate"
            matTooltipPosition="left"
            (click)="form.enable()"
          >
            {{ 'MyAccount.Edit' | translate }}
            <mat-icon>edit</mat-icon>
          </button>
        </ng-container>
        <ng-template #validation>
          <button
            mat-raised-button
            color="warn"
            [matTooltip]="'MyAccount.CancelTooltip' | translate"
            (click)="cancel()"
          >
            {{ 'Actions.Cancel' | translate }}
          </button>
          <button
            mat-raised-button
            type="button"
            class="button-success ml-1"
            [matTooltip]="'MyAccount.SaveTooltip' | translate"
            (click)="save()"
            [disabled]="form.invalid"
          >
            {{ 'Actions.Save' | translate }}
            <mat-icon>save</mat-icon>
          </button>
        </ng-template>
      </div>
    </form>
  </div>
</div>
