<div class="card card-page center-in-div">
  <div class="card-header">
    <h3 class="underlined main-color">{{ 'MyAccount.PasswordChangeTitle' | translate }}</h3>
  </div>

  <div class="card-body">
    <form [formGroup]="form">
      <div class="form-group row">
        <label
          for="init_password"
          class="col-sm-5 col-form-label text-right"
        >
          {{ 'MyAccount.CurrentPasswordLabel' | translate }}
        </label>
        <div class="col-sm-7 col-xl-5">
          <input
            type="password"
            class="form-control"
            id="init_password"
            [placeholder]="'MyAccount.CurrentPassword' | translate"
            formControlName="init_password"
          />
          <small
            *ngIf="
              form.get('init_password').hasError('required') && form.get('init_password').touched
            "
          >
            {{ 'MyAccount.Messages.FieldRequired' | translate }}
          </small>
        </div>
      </div>
      <div class="form-group row">
        <label
          for="password"
          class="col-sm-5 col-form-label text-right"
        >
          {{ 'MyAccount.NewPassword' | translate }}
        </label>
        <div class="col-sm-7 col-xl-5">
          <input
            type="password"
            class="form-control"
            id="password"
            [placeholder]="'MyAccount.NewPasswordPlaceholder' | translate"
            formControlName="password"
          />
          <small *ngFor="let error of getPasswordErrors()">
            <span
              *ngIf="form.get('password').touched && form.get('password').dirty"
              style="display: block"
            >
              {{ error }}
            </span>
          </small>
        </div>
      </div>
      <div class="form-group row">
        <label
          for="password_confirmation"
          class="col-sm-5 col-form-label text-right"
        >
          {{ 'MyAccount.PasswordConfirmation' | translate }}
        </label>
        <div class="col-sm-7 col-xl-5">
          <input
            type="password"
            class="form-control"
            id="password_confirmation"
            [placeholder]="'MyAccount.PasswordConfirmationPlaceholder' | translate"
            formControlName="password_confirmation"
          />
          <small
            *ngIf="
              form.get('password_confirmation').hasError('required') &&
              form.get('password_confirmation').touched
            "
          >
            {{ 'MyAccount.Messages.FieldRequired' | translate }}
          </small>
          <small
            *ngIf="form.hasError('similarError') && !form.get('password_confirmation').pristine"
          >
            {{ 'MyAccount.Messages.ConfirmationError' | translate }}
          </small>
        </div>
      </div>

      <div class="text-center">
        <a
          mat-raised-button
          color="warn"
          routerLink="../"
        >
          {{ 'Actions.Cancel' | translate }}
        </a>
        <span
          [matTooltip]="
            (!form.valid ? 'MyAccount.PasswordFormInvalid' : 'MyAccount.ChangePasswordTooltip')
              | translate
          "
        >
          <button
            mat-raised-button
            class="button-success ml-1"
            (click)="save()"
            [disabled]="!form.valid"
          >
            {{ 'MyAccount.Change' | translate }}
          </button>
        </span>
      </div>
    </form>
  </div>
</div>
