<mat-form-field
  appearance="outline"
  class="gn-field"
>
  <mat-label>{{ label | translate }}</mat-label>
  <mat-icon
    *ngIf="showIcon"
    matPrefix
    class="gn-field-icon"
  >
    lock
  </mat-icon>
  <input
    matInput
    type="password"
    id="password"
    [formControl]="control"
  />
</mat-form-field>
