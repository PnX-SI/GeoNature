<gn-auth-layout>
  <mat-card class="gn-login-card">
    <div class="gn-card-header">
      <h2>{{ confirmationButtonLabel }}</h2>
    </div>

    <mat-card-content>
      <p>{{ confirmationDivMessage }}</p>
      <button
        mat-raised-button
        color="primary"
        class="gn-btn-primary"
        (click)="submit()"
      >
        {{ confirmationButtonLabel }}
      </button>
    </mat-card-content>
  </mat-card>
</gn-auth-layout>
