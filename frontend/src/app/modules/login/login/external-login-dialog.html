<div data-qa="external-gn-connection">
  <h1
    mat-dialog-title
    class="gn-card-title"
  >
    {{ 'Authentication.Actions.LogIn' | translate }} — {{ data.provider.label }}
  </h1>

  <div mat-dialog-content>
    <form
      #externalUserForm="ngForm"
      (ngSubmit)="externalLogin(externalUserForm.value)"
    >
      <mat-form-field
        appearance="outline"
        class="gn-field"
      >
        <mat-label>{{ 'Authentication.Username' | translate }}</mat-label>
        <mat-icon
          matPrefix
          class="gn-field-icon"
        >
          person
        </mat-icon>
        <input
          matInput
          type="text"
          id="login"
          name="login"
          ngModel
          autofocus
          placeholder="{{ 'Authentication.UsernamePlaceholder' | translate }}"
          data-qa="gn-connection-id"
        />
      </mat-form-field>

      <mat-form-field
        appearance="outline"
        class="gn-field"
      >
        <mat-label>{{ 'Authentication.Password' | translate }}</mat-label>
        <mat-icon
          matPrefix
          class="gn-field-icon"
        >
          lock
        </mat-icon>
        <input
          matInput
          type="password"
          name="password"
          ngModel
          placeholder="{{ 'Authentication.PasswordPlaceholder' | translate }}"
          data-qa="gn-connection-pwd"
        />
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        class="gn-btn-primary w-100"
        type="submit"
        data-qa="gn-connection-button"
      >
        {{ 'Authentication.Actions.LogIn' | translate }}
      </button>
    </form>
  </div>
</div>
