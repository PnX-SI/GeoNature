<div class="d-flex flex-row justify-content-between">
  <button
    type="button"
    id="cancelImport"
    (click)="deleteImport()"
    mat-raised-button
    color="warn"
    data-qa="import-new-footer-delete"
  >
    {{ 'Import.Process.Footer.CancelDelete' | translate }}
  </button>
  <button
    *ngIf="stepComponent.step > 1"
    type="button"
    id="importListPage"
    (click)="saveAndLeaveImport()"
    mat-raised-button
    color="accent"
    [disabled]="!stepComponent.isNextStepAvailable()"
    data-qa="import-new-footer-save"
  >
    {{ 'Import.Process.Footer.SaveQuit' | translate }}
  </button>
</div>
