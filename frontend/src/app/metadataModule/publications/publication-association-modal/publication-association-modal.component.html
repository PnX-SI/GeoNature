<div class="modal-header">
  <h5 class="modal-title">{{ 'MetaData.Publications.AssociateToPublication' | translate }}</h5>
  <button
    type="button"
    class="close"
    aria-label="Close"
    (click)="cancel()"
  >
    <span aria-hidden="true">&times;</span>
  </button>
</div>

<div class="modal-body">
  <form [formGroup]="form">
    <div
      class="form-group"
      *ngIf="to === 'Dataset'"
    >
      <pnx-datasets
        id="datasets"
        [parentFormControl]="form.controls.targetElement"
        [displayOnlyActive]="false"
        [multiSelect]="false"
        label="{{ 'Datasets' | translate }}"
      ></pnx-datasets>
    </div>
    <div
      class="form-group"
      *ngIf="to === 'AcquisitionFramework'"
    >
      <pnx-acquisition-frameworks
        [multiSelect]="false"
        [displayAll]="true"
        [parentFormControl]="form.controls.targetElement"
        label="{{ 'AcquisitionFramework' | translate }}"
      ></pnx-acquisition-frameworks>
    </div>
    <div
      class="form-group"
      *ngIf="to === 'Publication'"
    >
      <pnx-publications-select
        [multiSelect]="false"
        [parentFormControl]="form.controls.targetElement"
        label="{{ 'MetaData.Publications.Publications' | translate }}"
      ></pnx-publications-select>
    </div>
  </form>
</div>

<div class="modal-footer">
  <button
    type="button"
    mat-raised-button
    color="warn"
    (click)="cancel()"
    [disabled]="isLoading"
  >
    {{ 'Actions.Cancel' | translate }}
  </button>

  <button
    type="button"
    mat-raised-button
    color="primary"
    (click)="submit()"
    [disabled]="form?.invalid || isLoading"
  >
    <mat-spinner
      *ngIf="isLoading"
      diameter="20"
      class="mr-2"
    ></mat-spinner>
    {{ 'Actions.Associate' | translate }}
  </button>
</div>
