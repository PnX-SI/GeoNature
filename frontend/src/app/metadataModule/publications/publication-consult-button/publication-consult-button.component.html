<ng-container [ngSwitch]="displayStyle">
  <ng-container *ngSwitchCase="'simpleUrl'">
    <a
      *ngIf="publicationUrl; else noUrl"
      (click)="onConsult()"
      class="simple-url-link"
      [matTooltip]="getTooltip()"
    >
      {{ publicationUrl }}
    </a>
    <ng-template #noUrl>-</ng-template>
  </ng-container>

  <ng-container *ngSwitchCase="'detailLook'">
    <button
      [class.disabled-look]="!publicationUrl"
      color="primary"
      mat-mini-fab
      class="mr-2"
      type="button"
      (click)="onConsult()"
      [matTooltip]="getTooltip()"
      data-qa="pnx-publications-consult-link"
    >
      <mat-icon>open_in_new</mat-icon>
    </button>
  </ng-container>

  <ng-container *ngSwitchDefault>
    <button
      [class.disabled-look]="!publicationUrl"
      mat-icon-button
      type="button"
      (click)="onConsult()"
      [matTooltip]="getTooltip()"
      data-qa="pnx-publications-consult-link"
    >
      <mat-icon>open_in_new</mat-icon>
    </button>
  </ng-container>
</ng-container>

<ng-template
  #externalLinkModal
  let-c="close"
  let-d="dismiss"
>
  <div class="modal-header">
    <h5 class="modal-title">
      {{ 'MetaData.Publications.ExternalLink.Title' | translate }}
    </h5>
  </div>
  <div class="modal-body">
    <p>{{ 'MetaData.Publications.ExternalLink.Warning' | translate }}</p>
    <p class="text-break">
      {{ 'MetaData.Publications.ExternalLink.Link' | translate }}
      <i>{{ pendingExternalUrl }}</i>
    </p>
    <div class="mt-3 text-right">
      <button
        mat-raised-button
        color="warn"
        class="uppercase mr-2"
        (click)="d()"
      >
        {{ 'Actions.Cancel' | translate }}
      </button>
      <button
        mat-raised-button
        class="button-success uppercase"
        (click)="openExternalLink(); c()"
      >
        {{ 'MetaData.Publications.ExternalLink.Confirm' | translate }}
      </button>
    </div>
  </div>
</ng-template>
