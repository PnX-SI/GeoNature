<pnx-data-grid
  [rows]="discussions"
  rowHeight="auto"
  [pagination]="pagination"
  [pageSizeOptions]="[pagination.perPage]"
  [externalSorting]="true"
  [sorts]="[{ prop: sort.sortBy, dir: sort.sortOrder }]"
  (pageChange)="onChangePage($event)"
  (sortChange)="onColumnSort($event)"
>
  <pnx-data-column
    [width]="5"
    [resizable]="false"
    [sortable]="false"
  >
    <ng-template
      let-row="row"
      pnxDataCell
    >
      <button
        mat-icon-button
        class="btn-no-padding btn-ghost"
        (click)="navigateToDiscussion(row.id_synthese)"
      >
        <i
          #iElement
          [matTooltip]="'Voir le fil de discussion lié à la synthese id : ' + row.id_synthese"
          class="fa fa-info-circle"
          aria-hidden="true "
        ></i>
      </button>
    </ng-template>
  </pnx-data-column>
  <pnx-data-column
    [width]="150"
    [prop]="PROP_CREATION_DATE"
    name="Date commentaire"
    [sortable]="true"
    [resizable]="true"
  >
    <ng-template
      pnxDataCell
      let-row="row"
    >
      {{ renderDate(row[PROP_CREATION_DATE]) }}
    </ng-template>
  </pnx-data-column>
  <pnx-data-column
    [width]="150"
    [prop]="PROP_USER"
    name="Auteur"
    [sortable]="true"
    [resizable]="true"
  >
    <ng-template
      pnxDataCell
      let-row="row"
    >
      {{ row?.user.nom_complet }}
    </ng-template>
  </pnx-data-column>
  <pnx-data-column
    [prop]="PROP_CONTENT"
    [width]="600"
    name="Contenu"
    [sortable]="true"
    [resizable]="true"
  >
    <ng-template
      pnxDataCell
      let-row="row"
    >
      <div class="TextContentContainer">
        <div class="TextContent">
          {{ row[PROP_CONTENT] }}
        </div>
      </div>
    </ng-template>
  </pnx-data-column>
  <pnx-data-column
    [width]="600"
    [prop]="PROP_OBSERVATION"
    name="Observation"
    [sortable]="false"
    [resizable]="true"
  >
    <ng-template
      pnxDataCell
      let-row="row"
    >
      <span [innerHTML]="row.observation"></span>
    </ng-template>
  </pnx-data-column>
</pnx-data-grid>
