<pnx-data-grid
  [rows]="validations"
  rowHeight="auto"
  [pagination]="pagination"
  [pageSizeOptions]="[pagination.perPage]"
  [externalSorting]="true"
  [sorts]="[{ prop: DEFAULT_SORTING.sortBy, dir: DEFAULT_SORTING.sortOrder }]"
  (pageChange)="onChangePage($event)"
  (sortChange)="onColumnSort($event)"
>
  <pnx-data-column
    [width]="60"
    [resizable]="false"
    [sortable]="false"
  >
    <ng-template
      let-row="row"
      pnxDataCell
    >
      <button
        mat-icon-button
        class="btn-no-padding btn-ghost"
        (click)="navigateToValidations(row)"
      >
        <i
          #iElement
          [matTooltip]="
            'Voir les informations de validations liées à l\'observation : ' + row.id_synthese
          "
          class="fa fa-info-circle"
          aria-hidden="true "
        ></i>
      </button>
    </ng-template>
  </pnx-data-column>
  <pnx-data-column
    [width]="150"
    name="Date"
    [sortable]="true"
    [resizable]="true"
    [prop]="PROP_VALIDATION_DATE"
  >
    <ng-template
      pnxDataCell
      let-row="row"
    >
      {{ renderDate(row[PROP_VALIDATION_DATE]) }}
    </ng-template>
  </pnx-data-column>
  <pnx-data-column
    [width]="150"
    [prop]="PROP_VALIDATOR"
    name="Validateur"
    [sortable]="true"
    [resizable]="true"
  >
    <ng-template
      pnxDataCell
      let-row="row"
    >
      {{ row[PROP_VALIDATOR] }}
    </ng-template>
  </pnx-data-column>
  <pnx-data-column
    [prop]="PROP_VALIDATION_STATUS"
    [width]="300"
    name="Statut de validation"
    [sortable]="false"
    [resizable]="true"
  >
    <ng-template
      pnxDataCell
      let-row="row"
    >
      <div class="BadgeContainer">
        <gn-badge
          [text]="row[PROP_VALIDATION_STATUS]"
          [symbology]="{ color: getValidationStatusColor(row[PROP_VALIDATION_CODE]) }"
        ></gn-badge>
        <div class="BadgeContainer__spacer"></div>
      </div>
    </ng-template>
  </pnx-data-column>
  <pnx-data-column
    [prop]="PROP_VALIDATION_MESSAGE"
    [width]="500"
    name="Message de validation"
    [sortable]="true"
    [resizable]="true"
  >
    <ng-template
      pnxDataCell
      let-row="row"
    >
      <div class="TextContentContainer">
        <div class="TextContent">
          {{ row[PROP_VALIDATION_MESSAGE] }}
        </div>
      </div>
    </ng-template>
  </pnx-data-column>

  <pnx-data-column
    [width]="500"
    [prop]="PROP_OBSERVATION"
    name="Observation"
    [sortable]="false"
    [resizable]="true"
  >
    <ng-template
      pnxDataCell
      let-row="row"
    >
      <span [innerHTML]="row.observation"></span>
    </ng-template>
  </pnx-data-column>
</pnx-data-grid>
