<div class="Taxa">
  <ng-template
    #cellDateTemplate
    let-date="date"
  >
    {{ renderDate(date) }}
  </ng-template>

  <ng-template
    #cellNumberTemplate
    let-value="value"
  >
    {{ value ? value : '-' }}
  </ng-template>

  <ng-template
    #cellTaxaTemplate
    let-label="label"
    let-cd_nom="cd_nom"
  >
    <a
      *ngIf="hasTaxonSheet(); else cellNameTemplate"
      class="Link"
      [routerLink]="getTaxonSheetUrl(cd_nom)"
    >
      <ng-template *ngTemplateOutlet="cellNameTemplate; context: { value: label }"></ng-template>
    </a>
  </ng-template>

  <ng-template
    #cellNameTemplate
    let-value="value"
  >
    {{ value | titlecase }}
  </ng-template>

  <pnx-data-grid
    class="Taxa__table"
    [rows]="items"
    [rowHeight]="44"
    [loading]="isLoading"
    [pagination]="pagination"
    [pageSizeOptions]="[pagination.perPage]"
    [externalSorting]="true"
    [sorts]="[{ prop: sort.sortBy, dir: sort.sortOrder }]"
    (pageChange)="onChangePage($event)"
    (sortChange)="onSort($event)"
  >
    <pnx-data-column
      name="Taxon"
      [prop]="PROP_NOM"
    >
      <ng-template
        pnxDataCell
        let-row="row"
      >
        <ng-template
          *ngTemplateOutlet="
            cellTaxaTemplate;
            context: { label: row[PROP_NOM], cd_nom: row[PROP_CD_NOM] }
          "
        ></ng-template>
      </ng-template>
    </pnx-data-column>
    <pnx-data-column
      name="Plus ancienne"
      [prop]="PROP_DATE_MIN"
    >
      <ng-template
        pnxDataCell
        let-row="row"
      >
        <ng-template
          *ngTemplateOutlet="cellDateTemplate; context: { date: row[PROP_DATE_MIN] }"
        ></ng-template>
      </ng-template>
    </pnx-data-column>
    <pnx-data-column
      name="Plus récente"
      [prop]="PROP_DATE_MAX"
    >
      <ng-template
        pnxDataCell
        let-row="row"
      >
        <ng-template
          *ngTemplateOutlet="cellDateTemplate; context: { date: row[PROP_DATE_MAX] }"
        ></ng-template>
      </ng-template>
    </pnx-data-column>
    <pnx-data-column
      name="Nombre d'observation(s)"
      [prop]="PROP_OBSERVATION_COUNT"
    >
      <ng-template
        pnxDataCell
        let-row="row"
      >
        <ng-template
          *ngTemplateOutlet="cellNumberTemplate; context: { value: row[PROP_OBSERVATION_COUNT] }"
        ></ng-template>
      </ng-template>
    </pnx-data-column>
    <pnx-data-column
      name="Nombre de dataset(s)"
      [prop]="PROP_DATASET_COUNT"
    >
      <ng-template
        pnxDataCell
        let-row="row"
      >
        <ng-template
          *ngTemplateOutlet="cellNumberTemplate; context: { value: row[PROP_DATASET_COUNT] }"
        ></ng-template>
      </ng-template>
    </pnx-data-column>
  </pnx-data-grid>
</div>
