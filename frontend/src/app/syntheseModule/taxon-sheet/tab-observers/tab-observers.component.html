<div class="Observers">
  <ng-template
    #cellDateTemplate
    let-date="date"
  >
    {{ renderDate(date) }}
  </ng-template>

  <ng-template
    #cellNameTemplate
    let-value="value"
  >
    {{ value | titlecase }}
  </ng-template>

  <ng-template
    #cellNumberTemplate
    let-value="value"
  >
    {{ value ? value : '-' }}
  </ng-template>

  <ng-template
    #cellDefaultTemplate
    let-value="value"
  >
    {{ value }}
  </ng-template>

  <pnx-data-grid
    class="Observers__table"
    [rows]="items"
    rowHeight="auto"
    [loading]="isLoading"
    [pagination]="pagination"
    [pageSizeOptions]="[pagination.perPage]"
    [externalSorting]="true"
    [sorts]="[{ prop: sort.sortBy, dir: sort.sortOrder }]"
    (pageChange)="onChangePage($event)"
    (sortChange)="onSort($event)"
  >
    <pnx-data-column
      name="Observateur"
      [prop]="PROP_OBSERVER"
    >
      <ng-template
        pnxDataCell
        let-row="row"
      >
        <ng-template
          *ngTemplateOutlet="cellNameTemplate; context: { value: row[PROP_OBSERVER] }"
        ></ng-template>
      </ng-template>
    </pnx-data-column>
    <pnx-data-column
      name="Plus ancienne"
      [prop]="PROP_DATE_MIN"
    >
      <ng-template
        pnxDataCell
        let-row="row"
      >
        <ng-template
          *ngTemplateOutlet="cellDateTemplate; context: { date: row[PROP_DATE_MIN] }"
        ></ng-template>
      </ng-template>
    </pnx-data-column>
    <pnx-data-column
      name="Plus récente"
      [prop]="PROP_DATE_MAX"
    >
      <ng-template
        pnxDataCell
        let-row="row"
      >
        <ng-template
          *ngTemplateOutlet="cellDateTemplate; context: { date: row[PROP_DATE_MAX] }"
        ></ng-template>
      </ng-template>
    </pnx-data-column>
    <pnx-data-column
      name="Nombre d'observation(s)"
      [prop]="PROP_OBSERVATION_COUNT"
    >
      <ng-template
        pnxDataCell
        let-row="row"
      >
        <ng-template
          *ngTemplateOutlet="cellNumberTemplate; context: { value: row[PROP_OBSERVATION_COUNT] }"
        ></ng-template>
      </ng-template>
    </pnx-data-column>
    <pnx-data-column
      name="Nombre de media(s)"
      [prop]="PROP_MEDIA_COUNT"
    >
      <ng-template
        pnxDataCell
        let-row="row"
      >
        <ng-template
          *ngTemplateOutlet="cellNumberTemplate; context: { value: row[PROP_MEDIA_COUNT] }"
        ></ng-template>
      </ng-template>
    </pnx-data-column>
  </pnx-data-grid>
</div>
