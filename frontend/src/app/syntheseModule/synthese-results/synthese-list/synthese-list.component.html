<!--Table-->
<pnx-data-grid
  #table
  [rows]="mapListService.tableData"
  [height]="gridHeight"
  selectionMode="single"
  [selected]="mapListService.selectedRow"
  [rowClass]="getRowClass"
  (sortChange)="onSort($event)"
  (selectionChange)="mapListService.onRowSelect({ selected: $event })"
>
  <pnx-data-column
    [width]="56"
    [sortable]="false"
  >
    <ng-template pnxDataHeader>
      <i
        id="dropdownMenuButton"
        class="fa fa-cog clickable"
        aria-hidden="true"
        data-toggle="dropdown"
        aria-haspopup="true"
        aria-expanded="false"
        matTooltip="{{ 'Columns' | translate }}"
        (click)="openModalCol($event, modalCol)"
      ></i>
    </ng-template>

    <ng-template
      let-row="row"
      pnxDataCell
    >
      <ng-container
        *ngIf="
          criteriaService.isCriteriaDisplay() && criteriaService.getCriteriaStyle(row) as criteria
        "
      >
        <div
          class="criteria-border"
          [style.background-color]="criteria.color"
          [matTooltip]="criteriaService.buildCriteriaTxt(criteria)"
          [aria-label]="criteria.label"
        ></div>
      </ng-container>

      <a
        class="link-dark"
        [routerLink]="['occurrence', row['id_synthese'], 'details']"
      >
        <!-- matTooltip="Afficher le détail de l'observation {{ row[mapListService.idName] }}" -->
        <i
          #iElement
          class="fa fa-info-circle"
          matTooltip="{{
            'Synthese.Actions.DisplayObsDetail'
              | translate: { id_synthese: row[mapListService.idName] }
          }}"
          aria-hidden="true"
          data-qa="synthese-info-btn"
        ></i>
      </a>
    </ng-template>
  </pnx-data-column>

  <pnx-data-column
    [width]="56"
    [sortable]="false"
  >
    <ng-template
      let-row="row"
      pnxDataCell
    >
      <a
        *ngIf="row.url_source"
        class="link-dark"
        (click)="backToModule(row.url_source, row.entity_source_pk_value)"
      >
        <i
          matTooltip="Voir l'observation dans le module de saisie"
          class="fa fa-file-text"
          aria-hidden="true"
        ></i>
      </a>
    </ng-template>
  </pnx-data-column>

  <!-- cellClass is use for test, the "data-qa" attr do not work because the html is generated -->
  <pnx-data-column
    *ngFor="let col of defaultColumns"
    [width]="col.max_width"
    [name]="col.name"
    [prop]="col.prop"
    [sortable]="true"
    cellClass="synthese-list-col-{{ col.prop }}"
  >
    <ng-template
      let-row="row"
      pnxDataCell
    >
      <span
        [title]="row[col.prop]"
        [ngSwitch]="col.prop"
      >
        <div *ngSwitchCase="['date_min', 'date_max'].includes(col.prop) ? col.prop : false">
          {{ getDate(row[col.prop]) }}
        </div>
        <div *ngSwitchCase="'nom_vern_or_lb_nom'">
          <a
            class="Link"
            [routerLink]="getTaxonSheetUrl(row.cd_nom)"
            data-qa="synthese-list-taxon-sheet-link"
            *ngIf="
              config.SYNTHESE.ENABLE_TAXON_SHEETS && row.hasOwnProperty('cd_nom');
              else cellDefault
            "
            matTooltip="Afficher la fiche du taxon"
          >
            <ng-container *ngTemplateOutlet="cellDefault"></ng-container>
          </a>
        </div>
        <div *ngSwitchCase="'dataset_name'">
          <a
            class="Link"
            [routerLink]="['/metadata/dataset_detail/' + row.id_dataset]"
            *ngIf="row.hasOwnProperty('id_dataset'); else cellDefault"
            matTooltip="Afficher la fiche du jeu de données"
          >
            <ng-container *ngTemplateOutlet="cellDefault"></ng-container>
          </a>
        </div>
        <ng-container *ngSwitchDefault>
          <ng-container *ngTemplateOutlet="cellDefault"></ng-container>
        </ng-container>
      </span>
      <ng-template #cellDefault>{{ row[col.prop] }}</ng-template>
    </ng-template>
  </pnx-data-column>
</pnx-data-grid>

<div class="actions-btns mt-3">
  <div class="col-auto">
    <button
      *ngIf="canImport"
      id="upload-btn"
      mat-stroked-button
      color="primary"
      [routerLink]="['/import', destinationImportCode, 'process', 'upload']"
    >
      {{ 'Actions.Upload' | translate }}
      <mat-icon>file_upload</mat-icon>
    </button>
  </div>
  <div class="col-auto">
    <button
      type="button"
      id="download-btn"
      mat-stroked-button
      color="primary"
      (click)="openDownloadModal()"
      [disabled]="_cruvedStore.cruved?.SYNTHESE?.cruved?.E === 0"
      data-qa="synthese-download-btn"
    >
      {{ 'Actions.Download' | translate }}
      <mat-icon>file_download</mat-icon>
    </button>
  </div>
</div>
<ng-template
  #modalCol
  let-c="close"
  let-d="dismiss"
>
  <div class="modal-header">
    <h4>{{ 'DisplayColumns' | translate }}</h4>
  </div>
  <div class="modal-body">
    <div *ngFor="let col of availableColumns">
      <mat-checkbox
        [id]="col.name"
        (change)="toggleColumnNames(col)"
        [checked]="col.checked"
      >
        {{ col.name | readablePropertie }}
      </mat-checkbox>
    </div>
  </div>
</ng-template>
