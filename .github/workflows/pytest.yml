name: pytest

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - "contrib/**/backend/**"
    branches:
      - master
      - hotfixes
      - develop
  pull_request:
    paths:
      - "backend/**"
      - "contrib/**/backend/**"
    branches:
      - master
      - hotfixes
      - develop
      - feat/standard_mtd_v2

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debian-version: ["12", "13"]
        include:
          - debian-version: "12"
            python-version: "3.11"
            postgres-version: "15"
            postgis-version: "3.3"
          - debian-version: "13"
            python-version: "3.13"
            postgres-version: "17"
            postgis-version: "3.5"

    name: Debian ${{ matrix.debian-version }}

    services:
      postgres:
        image: ghcr.io/pnx-si/geonature-db:latest
        env:
          POSTGRES_DB: geonature2db
          POSTGRES_PASSWORD: geonatadmin
          POSTGRES_USER: geonatadmin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout
          5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            backend/requirements.txt
            contrib/*/pyproject.toml
      - name: Install GDAL
        run: |
          sudo apt update
          sudo apt install -y libgdal-dev
      - name: Install dependencies
        if: github.base_ref == 'master'
        run: |
          echo 'Installation des requirements de prod'
          uv pip install --system \
            -e ..[tests] \
            -r requirements.txt
        working-directory: ./backend
      - name: Install dependencies
        if: github.base_ref != 'master'
        run: |
          echo 'Installation des requirements de dev'
          # Siblings resolve to their local backend/dependencies/* submodule checkout
          # via [tool.uv.sources] in the root pyproject.toml (uv workspace).
          uv pip install --system -e ..[tests,lint]
        working-directory: ./backend

      - name: Install core modules backend
        run: |
          uv pip install --system -e contrib/occtax
          uv pip install --system -e contrib/gn_module_occhab
          uv pip install --system -e contrib/gn_module_validation
      - name: Install core modules database
        run: |
          geonature db autoupgrade
          geonature upgrade-modules-db
          geonature db downgrade ref_geo_inpn_grids_50@base
        env:
          GEONATURE_CONFIG_FILE: config/test_config.toml
      - name: Show database status
        run: |
          geonature db status --dependencies
        env:
          GEONATURE_CONFIG_FILE: config/test_config.toml
      - name: Test with pytest
        run: |
          pytest -v --cov --cov-report xml
        env:
          GEONATURE_CONFIG_FILE: config/test_config.toml
      - name: Upload coverage to Codecov
        if: ${{ matrix.debian-version == '12' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: pytest
