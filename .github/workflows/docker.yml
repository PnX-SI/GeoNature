name: Docker

on:
  push:
    branches:
      - develop
  release:
    types: [published]
  workflow_dispatch:
  repository_dispatch:
    types: [build-docker]

# several dispatches of the same commit at once should not queue up duplicate builds
concurrency:
  group: docker-${{ github.event.client_payload.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: True
          ref: ${{ github.event.client_payload.ref || github.ref }}
          fetch-depth: ${{ github.event_name == 'repository_dispatch' && '0' || '1' }} # could be removed with docker/metadata-action > 6.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate metadata for wheels image
        id: meta-wheels
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ghcr.io/${{ github.repository_owner }}/geonature-backend
          flavor: |
            suffix=-wheels
          tags: |
            type=ref,event=branch,enable=${{ github.event_name != 'repository_dispatch' }}
            type=ref,event=tag,enable=${{ github.event_name != 'repository_dispatch' }}
            type=sha
      - name: Build and export wheels image
        id: build-wheels
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          target: wheels
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-wheels.outputs.tags }}
          labels: ${{ steps.meta-wheels.outputs.labels }}
      - name: Generate metadata for prod image
        id: meta-prod
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ghcr.io/${{ github.repository_owner }}/geonature-backend
          tags: |
            type=ref,event=branch,enable=${{ github.event_name != 'repository_dispatch' }}
            type=ref,event=tag,enable=${{ github.event_name != 'repository_dispatch' }}
            type=sha
      - name: Build and export prod image
        id: build-prod
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          target: prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-prod.outputs.tags }}
          labels: ${{ steps.meta-prod.outputs.labels }}

  build-frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: True
          ref: ${{ github.event.client_payload.ref || github.ref }}
          fetch-depth: ${{ github.event_name == 'repository_dispatch' && '0' || '1' }} # could be removed with docker/metadata-action > 6.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate metadata for source image
        id: meta-source
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ghcr.io/${{ github.repository_owner }}/geonature-frontend
          flavor: |
            suffix=-source
          tags: |
            type=ref,event=branch,enable=${{ github.event_name != 'repository_dispatch' }}
            type=ref,event=tag,enable=${{ github.event_name != 'repository_dispatch' }}
            type=sha
      - name: Build and export source image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./frontend/Dockerfile
          target: source
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-source.outputs.tags }}
          labels: ${{ steps.meta-source.outputs.labels }}
      - name: Generate metadata for nginx image
        id: meta-nginx
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ghcr.io/${{ github.repository_owner }}/geonature-frontend
          flavor: |
            suffix=-nginx
          tags: |
            type=ref,event=branch,enable=${{ github.event_name != 'repository_dispatch' }}
            type=ref,event=tag,enable=${{ github.event_name != 'repository_dispatch' }}
            type=sha
      - name: Build and export nginx image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./frontend/Dockerfile
          target: prod-base
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-nginx.outputs.tags }}
          labels: ${{ steps.meta-nginx.outputs.labels }}
      - name: Generate metadata for prod image
        id: meta-prod
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ghcr.io/${{ github.repository_owner }}/geonature-frontend
          tags: |
            type=ref,event=branch,enable=${{ github.event_name != 'repository_dispatch' }}
            type=ref,event=tag,enable=${{ github.event_name != 'repository_dispatch' }}
            type=sha
      - name: Build and export prod image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./frontend/Dockerfile
          target: prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-prod.outputs.tags }}
          labels: ${{ steps.meta-prod.outputs.labels }}
