    <!-- <div *ngIf="formService.formBuilded">
      <div *ngFor="let area of formService.areasFilters; let i = index">
        <pnx-areas

          [label]="area.label"

          [withoutGeom]="true"
        ></pnx-areas>
      </div>
    </div> -->
    <!-- + communes + departements -->
  </fieldset>

  <!-- WHO? -->
  <fieldset>
    <legend>{{ 'Who' | translate }}</legend>
    <pnx-multiselect
      [values]="organisms"
      [parentFormControl]="occtaxMapListService.dynamicFormGroup.controls.organism"
      keyLabel="nom_organisme"
      keyValue="id_organisme"
      [label]="'Organism' | translate"
      debounceTime="500"
      [disabled]="false"
    ></pnx-multiselect>
    <ng-container *ngIf="occtaxConfig.moduleConf.observers_txt; else elseBlock">
      <pnx-observers-text
        [parentFormControl]="occtaxMapListService.dynamicFormGroup.controls.observers_txt"
      ></pnx-observers-text>
    </ng-container>
    <ng-template #elseBlock>
      <pnx-observers
        class="auto"
        label="{{ 'Observers' | translate }}"
        [parentFormControl]="occtaxMapListService.dynamicFormGroup.controls.observers"
        [multiSelect]="true"
        [idMenu]="occtaxConfig.moduleConf.id_observers_list"
      ></pnx-observers>
    </ng-template>
  </fieldset>

  <!-- HOW? -->
  <fieldset>
    <legend>{{ 'How' | translate }}</legend>
    <pnx-acquisition-frameworks
      [multiSelect]="true"
      [displayAll]="true"
      [parentFormControl]="occtaxMapListService.dynamicFormGroup.controls.acquisition_framework"
      label="{{ 'AcquisitionFramework' | translate }}"
      data-qa="phyto-form-ca"
    ></pnx-acquisition-frameworks>

    <pnx-datasets
      class="auto"
      label="{{ 'Dataset' | translate }}"
      [displayAll]="true"
      [displayOnlyActive]="false"
      [parentFormControl]="occtaxMapListService.dynamicFormGroup.controls.id_dataset"
      [moduleCode]="moduleService.currentModule?.module_code"
    ></pnx-datasets>
  </fieldset>

  <!-- ADVANCED FILTERS -->
  <fieldset>
    <legend>{{ 'Filters.Actions.Advanced' | translate }}</legend>
    <pnx-dynamic-form-generator
      #dynamicForm
      [myFormGroup]="occtaxMapListService.dynamicFormGroup"
      [formsDefinition]="formsDefinition"
    ></pnx-dynamic-form-generator>
  </fieldset>

  <!-- BUTTONS -->
  <mat-card-actions
    style="justify-content: space-between"
    align="end"
  >
    <button
      mat-stroked-button
      color="warn"
      (click)="refreshFilters()"
      matTooltip="{{ 'Filters.Actions.Refresh' | translate }}"
      data-qa="pnx-phyto-refresh-search"
    >
      <mat-icon style="margin-right: 0">delete_sweep</mat-icon>
    </button>

    <button
      mat-flat-button
      color="primary"
      (click)="searchData()"
      data-qa="pnx-phyto-filter-search"
    >
      <mat-icon>search</mat-icon>
      {{ 'Actions.Search' | translate }}
    </button>
  </mat-card-actions>
</div>
