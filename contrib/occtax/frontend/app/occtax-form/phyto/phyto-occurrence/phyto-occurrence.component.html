<mat-card
  class="m-1 mb-3 phyto-card"
  appearance="outlined"
  data-qa="pnx-phyto-occurrence"
>
  <mat-card-header class="p-0 m-0">
    <mat-card-title class="phyto-card-title p-1 m-0">
      <button
        mat-mini-fab
        type="button"
        [color]="isCardExpanded ? 'warn' : 'primary'"
        class="phyto-title-toggle"
        [attr.aria-expanded]="isCardExpanded"
        aria-controls="phyto-occurrence-content phyto-occurrence-actions"
        [attr.aria-label]="'Occtax.Taxon.Actions.ToggleAddTaxonForm' | translate"
        (click)="toggleCard()"
      >
        <mat-icon class="phyto-title-icon">
          {{ isCardExpanded ? 'close_small' : 'add_circle' }}
        </mat-icon>
      </button>
      {{ 'Occtax.Taxon.AddTaxon' | translate }}
    </mat-card-title>
  </mat-card-header>

  <mat-card-content
    *ngIf="isCardExpanded"
    id="phyto-occurrence-content"
    class="container-fluid p-1 m-0"
  >
    <div class="row">
      <div class="col col-12 col-sm-12 col-md-12 col-lg-6 col-xl-6">
        <!-- QUOTED NAME & VALID NAME INPUTS -->
        <pnx-taxonomy
          [label]="
            occurrenceForm.get('nom_cite').hasError('required') &&
            taxonForm.touched &&
            !taxonFormFocus
              ? ('Occtax.Taxon.QuotedName' | translate) +
                ' /!\\ ' +
                ('Occtax.Taxon.Errors.NomCiteRequiredError' | translate) +
                ' /!\\'
              : ('Occtax.Taxon.QuotedName' | translate)
          "
          [parentFormControl]="taxonForm"
          [idList]="occtaxFormService.idTaxonList"
          [charNumber]="3"
          [listLength]="occtaxConfigService.moduleConf.taxon_result_number"
          [displayAdvancedFilters]="false"
          displayedLabel="search_name"
          (focusin)="taxonFormFocus = true"
          (focusout)="taxonFormFocus = false"
          (onChange)="selectAddOcc()"
          [ngClass]="
            occurrenceForm.get('nom_cite').hasError('required') &&
            taxonForm.touched &&
            !taxonFormFocus
              ? 'error'
              : ''
          "
        ></pnx-taxonomy>

        <!-- COMMENT INPUT -->
        <!-- <mat-form-field
          *ngIf="occtaxConfigService.moduleConf.form_fields.comment_occ"
          appearance="outline"
          subscriptSizing="dynamic"
          class="phyto-form-field mt-1 p-0"
        > -->
        <small for="commentaire">{{ 'Comment' | translate }}</small>
        <!-- <mat-label>{{ 'Comment' | translate }}</mat-label> -->
        <textarea
          class="form-control form-control-sm"
          [formControl]="occurrenceForm.get('comment')"
          rows="1"
          id="commentaire"
          data-qa="phyto-comment"
        ></textarea>
        <!-- </mat-form-field> -->
      </div>

      <!-- Abundances by Strata table -->
      <div class="col col-12 col-sm-12 col-md-12 col-lg-6 col-xl-6 mt-1">
        <!-- TODO: [Angular Material v15 / Validation] Replace <small class="form-danger"> with <mat-error> -->
        <small
          id="phyto-counting-required-error"
          *ngIf="occurrenceForm.get('cor_counting_occtax').hasError('required')"
          class="form-danger"
          role="alert"
        >
          {{ 'Occtax.Taxon.Errors.CountingRequiredError' | translate }}
        </small>
        <div class="table-responsive">
          <table
            class="abundance-table mdc-data-table__table"
            [attr.aria-describedby]="
              occurrenceForm.get('cor_counting_occtax').hasError('required')
                ? 'phyto-counting-required-error'
                : null
            "
            data-qa="pnx-phyto-abundance-table"
          >
            <caption class="cdk-visually-hidden">
              {{ 'Occtax.Counting.Abundance' | translate }}
            </caption>

            <thead>
              <tr class="mdc-data-table__header-row tr-compacted">
                <th class="first-col mdc-data-table__header-cell p-1">
                  {{ 'Occtax.Releve.Stratum' | translate }}
                </th>
                <th
                  *ngFor="let stratum of strataColumns; index as i"
                  class="abundance-headers withTooltip mdc-data-table__header-cell p-1"
                  matTooltip="{{ stratum.label }}"
                  aria-label="{{ stratum.label }}"
                >
                  {{ stratum.mnemonique }}
                </th>
              </tr>
            </thead>
            <tbody class="mdc-data-table__content">
              <tr class="mdc-data-table__row">
                <th class="first-col mdc-data-table__cell p-1">
                  {{ 'Occtax.Counting.Abundance' | translate }}
                </th>
                <td
                  *ngFor="let stratum of strataColumns; index as i"
                  class="mdc-data-table__cell p-1"
                >
                  <pnx-phyto-abundance
                    [value]="stratum.counting"
                    [stratumId]="stratum.id"
                  ></pnx-phyto-abundance>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </mat-card-content>

  <mat-card-actions
    *ngIf="isCardExpanded"
    id="phyto-occurrence-actions"
    class="phyto-card-actions m-0 p-1"
    align="end"
  >
    <!-- SAVE BUTTON -->
    <button
      id="add-occ"
      data-qa="phyto-save-occurrence"
      #saveOccurrenceButton
      mat-raised-button
      color="primary"
      matTooltip="{{ 'Occtax.Taxon.Actions.SaveThisTaxon' | translate }}"
      [attr.aria-label]="'Occtax.Taxon.Actions.SaveThisTaxon' | translate"
      [disabled]="phytoOccurrenceService.form.invalid"
      [attr.aria-busy]="phytoOccurrenceService.saveWaiting"
      (click)="submitOccurrenceForm()"
      class="button-compacted"
    >
      <mat-spinner
        *ngIf="phytoOccurrenceService.saveWaiting"
        diameter="25"
        aria-hidden="true"
      ></mat-spinner>
      {{ 'Occtax.Taxon.Actions.SaveThisTaxon' | translate }}
      <mat-icon class="align-middle">save</mat-icon>
    </button>
  </mat-card-actions>
</mat-card>
