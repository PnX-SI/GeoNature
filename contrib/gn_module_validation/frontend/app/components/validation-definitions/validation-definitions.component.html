<button
  *ngIf="showDefinitions"
  type="button"
  id="showDef"
  class="btn btn-sm btn-light box-shadow"
  (click)="getDefinitions()"
>
  {{ 'Validation.UI.HideDefinitions' | translate }}
</button>
<button
  *ngIf="!showDefinitions"
  type="button"
  id="hideDef"
  class="btn btn-sm btn-light box-shadow"
  (click)="getDefinitions()"
>
  {{ 'Validation.UI.ShowDefinitions' | translate }}
</button>

<p></p>

<table *ngIf="showDefinitions">
  <thead>
    <tr>
      <th class="table_status">{{ 'Status' | translate }}</th>
      <th class="table_definition">{{ 'Validation.UI.Definition' | translate }}</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let def of definitions">
      <td
        [ngStyle]="{
          background: config.VALIDATION.STATUS_INFO[def.cd_nomenclature]?.color
        }"
      >
        {{ def.mnemonique }}
      </td>
      <td>{{ def.definition_default }}</td>
    </tr>
  </tbody>
</table>
