<div
  id="cover-spin"
  *ngIf="!_ds.dataLoaded"
></div>

<gn-map-list-layout
  [(filterCollapsed)]="isCollapseValidationNavBar"
  [mapRatio]="2"
  [listRatio]="3"
>
  <pnx-synthese-search
    filter
    [displayValidation]="true"
    (resetFilter)="goHome()"
    (searchClicked)="loadAndStoreData($event)"
  ></pnx-synthese-search>
  <pnx-validation-synthese-carte
    map
    [inputSyntheseData]="_mapListService.geojsonData"
  ></pnx-validation-synthese-carte>
  <pnx-validation-synthese-list
    list
    [idSynthese]="idSynthese"
    [inputSyntheseData]="_mapListService.tableData"
    [validationStatus]="validationStatus"
    [selectedTab]="selectedTab"
    (displayAll)="goHome()"
  ></pnx-validation-synthese-list>
</gn-map-list-layout>
