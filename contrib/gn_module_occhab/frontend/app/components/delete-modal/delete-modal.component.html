<div class="modal-header">
  <h4 class="modal-title pull-left">Suppression</h4>
  <button
    mat-icon-button
    type="button"
    class="pull-right"
    aria-label="Close"
    (click)="c()"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>
<div class="modal-body">
  <p>
    Attention vous vous apprêtez à supprimer une station qui comporte
    {{ nbHabitats }} habitat(s)
  </p>
  <button
    mat-raised-button
    (click)="c()"
  >
    Annuler
  </button>
  <button
    mat-raised-button
    color="warn"
    class="mr-1"
    (click)="deleteStation(); c()"
  >
    Supprimer
  </button>
</div>
