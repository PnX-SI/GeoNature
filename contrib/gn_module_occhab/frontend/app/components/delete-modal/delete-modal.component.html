<div class="modal-header">
  <h4 class="modal-title pull-left">{{ 'Import.Modal.DeleteTitle' | translate }}</h4>
  <button
    type="button"
    class="close pull-right"
    aria-label="Close"
    (click)="c()"
  >
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body">
  <p>
    {{ 'Occhab.UI.DeleteWarning' | translate: { n: nbHabitats } }}
  </p>
  <button
    mat-raised-button
    (click)="c()"
    class="btn btn-secondary"
  >
    {{ 'Actions.Cancel' | translate }}
  </button>
  <button
    mat-raised-button
    color="warn"
    class="mr-1"
    (click)="deleteStation(); c()"
  >
    {{ 'Actions.Delete' | translate }}
  </button>
</div>
