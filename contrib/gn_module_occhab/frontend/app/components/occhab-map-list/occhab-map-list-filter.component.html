<div class="row row-sm form">
  <div class="col-12">
    <mat-form-field
      class="w-100"
      appearance="outline"
    >
      <mat-label>ID Import</mat-label>
      <input
        matInput
        [formControl]="mapListFormService.searchForm.get('id_import')"
        placeholder="Id de l'import"
      />
    </mat-form-field>
  </div>
  <div class="col-12">
    <pnx-datasets
      label="{{ 'Dataset' | translate }}"
      [displayAll]="true"
      [displayOnlyActive]="false"
      [parentFormControl]="mapListFormService.searchForm.get('id_dataset')"
      moduleCode="OCCHAB"
    ></pnx-datasets>
  </div>
  <div class="col-12">
    <pnx-autocomplete
      apiEndPoint="{{ config.API_ENDPOINT }}/habref/habitats/autocomplete"
      [searchAsParameter]="false"
      [parentFormControl]="mapListFormService.searchForm.get('habitat')"
      queryParamSearch="search_name"
      [othersGetParams]="{ id_list: config.OCCHAB.ID_LIST_HABITAT }"
      [formatter]="formatter"
      keyValue="search_name"
      label="Habitat"
      placeholder="Tapez les 1eres lettres de l'habitat"
    ></pnx-autocomplete>
  </div>
  <div class="col-12">
    <pnx-date
      label="{{ 'MinDate' | translate }}"
      [parentFormControl]="mapListFormService.searchForm.get('date_low')"
    ></pnx-date>
  </div>

  <div class="col-12">
    <pnx-date
      label="{{ 'MaxDate' | translate }}"
      [parentFormControl]="mapListFormService.searchForm.get('date_up')"
    ></pnx-date>
  </div>

  <div class="col-12 actions">
    <button
      mat-icon-button
      color="warn"
      (click)="resetFilterForm()"
      matTooltip="{{ 'Filters.Actions.Refresh' | translate }}"
    >
      <i
        class="fa fa-refresh"
        aria-hidden="true"
      ></i>
    </button>
    <button
      mat-flat-button
      color="primary"
      (click)="searchEvent($event)"
    >
      Rechercher
    </button>
  </div>
</div>
